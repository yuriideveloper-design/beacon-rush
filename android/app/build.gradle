import java.util.Properties
import java.io.FileInputStream

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('../keystore.properties')
if (!keystorePropertiesFile.isFile()) {
    throw new GradleException("Missing release signing properties: ${keystorePropertiesFile}")
}
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

def requiredSigningProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
requiredSigningProperties.each { propertyName ->
    if (!keystoreProperties.getProperty(propertyName)?.trim()) {
        throw new GradleException("Missing '${propertyName}' in ${keystorePropertiesFile}")
    }
}

def releaseKeystoreFile = rootProject.file('../' + keystoreProperties.getProperty('storeFile'))
if (!releaseKeystoreFile.isFile()) {
    throw new GradleException("Missing release keystore: ${releaseKeystoreFile}")
}

def enableReleaseShrink = project.hasProperty('enableReleaseShrink') &&
    project.property('enableReleaseShrink').toString().toBoolean()

android {
    namespace = "com.pixelhaven.beaconrush"
    compileSdk = 37
    ndkVersion = "28.2.13676358"
    externalNativeBuild {
        cmake {
            path = file("src/lamp/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.pixelhaven.beaconrush"
        minSdk = 24
        targetSdk = 37
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        externalNativeBuild {
            cmake {
                cppFlags += ""
                arguments += "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile releaseKeystoreFile
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableReleaseShrink
            shrinkResources enableReleaseShrink
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

}

flutter {
    source = "../.."
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2026.03.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"
    implementation "androidx.fragment:fragment:1.9.0"
    implementation "androidx.fragment:fragment-ktx:1.9.0"
    implementation "androidx.core:core-ktx:1.18.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2"
    implementation "io.ktor:ktor-client-core:3.1.3"
    implementation "io.ktor:ktor-client-android:3.1.3"
    implementation "com.google.android.gms:play-services-ads-identifier:18.2.0"
    implementation "com.android.installreferrer:installreferrer:2.2"
    implementation "androidx.work:work-runtime-ktx:2.11.0"
    implementation platform("com.google.firebase:firebase-bom:33.12.0")
    implementation "com.google.firebase:firebase-messaging"
    constraints {
        implementation("androidx.fragment:fragment:1.9.0")
        implementation("androidx.fragment:fragment-ktx:1.9.0")
    }
}

if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}
